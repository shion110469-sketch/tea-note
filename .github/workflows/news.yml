name: Update tea news

on:
  schedule:
    - cron: '0 */6 * * *'   # 6時間ごと（UTC）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch news
        shell: pwsh
        run: ./scripts/fetch-news.ps1 -Out news.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "ニュースを更新"
          git push
