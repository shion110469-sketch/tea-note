<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2B1E18" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100B09" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent にすると、iOS のホーム画面アプリで画面の高さが短く計算され、タブバーが下端から浮くことがある -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="紅茶ノート">
  <title>紅茶ノート</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <a href="#/home" class="logo"><span data-icon="cup"></span>紅茶ノート</a>
  </header>

  <main id="view" class="view"></main>

  <button id="mini-timer" class="mini-timer" hidden></button>

  <nav class="tabbar" aria-label="メインメニュー">
    <a href="#/home" data-tab="home"><span data-icon="home"></span>ホーム</a>
    <a href="#/timer" data-tab="timer"><span data-icon="timer"></span>タイマー</a>
    <a href="#/notes" data-tab="notes"><span data-icon="note"></span>記録</a>
    <a href="#/teas" data-tab="teas"><span data-icon="leaf"></span>茶葉・在庫</a>
    <a href="#/news" data-tab="news"><span data-icon="news"></span>ニュース</a>
    <a href="#/guide" data-tab="guide"><span data-icon="book"></span>ガイド</a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/icons.js"></script>
  <script>document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon]; });</script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
